<div id="leaderboard-modal" class="modal">
    <div class="modal-content lb-elite-card">
        
        <div class="lb-elite-header">
            <div>
                <h2 class="lb-title">Leaderboard</h2>
                <p class="lb-subtitle">Global Top 10 Scores</p>
            </div>
            <button class="lb-elite-close" onclick="closeLeaderboard()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="lb-elite-profile">
            <div id="lb-user-display" class="lb-profile-view">
                <div class="lb-profile-info">
                    <span class="lb-profile-label">Current Player</span>
                    <strong id="lb-current-name">Loading...</strong>
                </div>
                <button class="lb-elite-edit-btn" onclick="toggleEditMode(true)" title="Edit Username">
                    <span>Edit</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                </button>
            </div>

            <div id="lb-user-edit" class="lb-profile-edit hidden">
                <div class="lb-edit-flex">
                    <div class="lb-input-wrapper">
                        <input type="text" id="inline-username-input" autocomplete="off" spellcheck="false" maxlength="15" oninput="checkUsernameAvailability()" placeholder="New username">
                        <div id="inline-username-status" class="status-msg"></div>
                    </div>
                    <div class="lb-action-wrapper">
                        <button class="lb-elite-cancel" onclick="toggleEditMode(false)">Cancel</button>
                        <button class="lb-elite-save" id="inline-save-btn" onclick="confirmInlineUsername()" disabled>Save</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="leaderboard-container">
            <div class="leaderboard-list" id="leaderboard-body">
            </div>
        </div>

    </div>
</div>
